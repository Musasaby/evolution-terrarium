<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>描画ベンチマーク（個体数別）</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #101418; color: #d8e2ea; font-family: ui-monospace, monospace; }
  #view { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: 0; right: 0; width: min(560px, 46vw); height: 100%; overflow: auto;
    box-sizing: border-box; padding: 12px 14px; background: rgba(16, 20, 24, 0.86);
    border-left: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(4px);
  }
  #panel h1 { font-size: 14px; margin: 0 0 8px; font-weight: 500; }
  #panel p { font-size: 11px; line-height: 1.5; margin: 0 0 10px; color: #9fb0bd; }
  #out { font-size: 11px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; margin: 0 0 10px; }
  #json { width: 100%; height: 180px; box-sizing: border-box; font: 11px/1.45 ui-monospace, monospace; color: #cfe0ec; background: #0b0f13; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; padding: 8px; resize: vertical; }
  #status { font-size: 11px; color: #ffcc00; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>描画ベンチマーク（個体数別）</h1>
  <p>個体数を変えて描画の所要時間を測ります。URL パラメータ: <code>counts</code>（既定 200,500,1000,2000）・<code>frames</code>（既定 300）・<code>warm</code>（既定 60）・<code>seed</code>（既定 1）。</p>
  <div id="status">準備中…</div>
  <pre id="out"></pre>
  <textarea id="json" readonly></textarea>
</div>
<script type="module" src="./render-bench.js"></script>
</body>
</html>
