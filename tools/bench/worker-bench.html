<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sim の主スレッド／Worker 比較</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #101418; color: #d8e2ea; font-family: ui-monospace, monospace; }
  #view { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: 0; right: 0; width: min(620px, 48vw); height: 100%; overflow: auto;
    box-sizing: border-box; padding: 12px 14px; background: rgba(16, 20, 24, 0.86);
    border-left: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(4px);
  }
  #panel h1 { font-size: 14px; margin: 0 0 8px; font-weight: 500; }
  #panel p { font-size: 11px; line-height: 1.5; margin: 0 0 10px; color: #9fb0bd; }
  #out { font-size: 11px; line-height: 1.5; white-space: pre; overflow-x: auto; margin: 0 0 10px; }
  #json { width: 100%; height: 180px; box-sizing: border-box; font: 11px/1.45 ui-monospace, monospace; color: #cfe0ec; background: #0b0f13; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; padding: 8px; resize: vertical; }
  #status { font-size: 11px; color: #ffcc00; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>sim の主スレッド／Worker 比較</h1>
  <p>同じ簡易描画で、sim を主スレッドで動かす場合と Worker で動かす場合を比べます。URL パラメータ: <code>modes</code>（既定 main,worker）・<code>speeds</code>（既定 1,8）・<code>secs</code>（既定 20）・<code>seed</code>（既定 1）。</p>
  <div id="status">準備中…</div>
  <pre id="out"></pre>
  <textarea id="json" readonly></textarea>
</div>
<script type="module" src="./worker-bench.js"></script>
</body>
</html>
