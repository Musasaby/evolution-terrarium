<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>円柱生物の進化箱庭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./src/styles.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
} }
</script>
<script type="module" src="./src/app/main.js"></script>
</head>
<body>
<div id="app">
  <header>
    <h1>円柱生物の進化箱庭</h1>
    <div class="readings" id="readings">
      <span title="経過年数と季節"><b id="r-year">0.0</b>年 <b id="r-season">春</b></span>
      <span title="気温"><b id="r-temp">--</b>℃</span>
      <span title="湖の水位（基準からの差、m）">湖<b id="r-water">--</b></span>
      <span title="天候"><span class="chip" id="r-weather">晴</span></span>
      <span title="生きている個体数">個体<b id="r-pop">0</b></span>
      <span title="現存する種の数">種<b id="r-sp">0</b></span>
      <span title="最大世代数">世代<b id="r-gen">0</b></span>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="速度" id="speeds">
        <button id="sp-0" data-s="0" title="一時停止（Space キー）">停止</button>
        <button id="sp-1" data-s="1" aria-pressed="true" title="等速">×1</button>
        <button id="sp-3" data-s="3" title="3 倍速">×3</button>
        <button id="sp-8" data-s="8" title="8 倍速">×8</button>
        <button id="sp-max" data-s="999" title="できるだけ速く進める">最大</button>
      </div>
      <div class="seg" role="group" aria-label="環境イベント">
        <button id="ev-rain" data-w="rain" title="雨を降らせる">雨</button>
        <button id="ev-drought" data-w="drought" title="干ばつを起こす">干ばつ</button>
        <button id="ev-ice" data-w="ice" title="氷河期を起こす">氷河期</button>
      </div>
      <button class="lone" id="btn-panel" aria-pressed="true" title="右パネルの開閉（B キー）">パネル</button>
      <button class="lone" id="btn-perf" aria-pressed="false" title="パフォーマンス表示の切り替え（P キー）">性能</button>
      <button class="lone" id="btn-reset" title="今の世界を捨てて新しい世界を生成する">新しい世界</button>
    </div>
  </header>

  <div id="view">
    <div id="loading"><div><div class="big">世界を生成中</div><p id="loading-msg">物理エンジンを読み込んでいます…</p></div></div>
    <section id="perf" aria-label="パフォーマンス" hidden></section>
    <div id="hint">ドラッグで回転・ホイールで拡大・クリックで観察</div>
  </div>

  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-stats" aria-selected="true" data-p="p-stats">統計</button>
      <button role="tab" id="tab-ind" aria-selected="false" data-p="p-ind">個体</button>
      <button role="tab" id="tab-tree" aria-selected="false" data-p="p-tree">系統樹</button>
      <button role="tab" id="tab-log" aria-selected="false" data-p="p-log">記録</button>
    </div>

    <section class="pane" id="p-stats" role="tabpanel">
      <div>
        <h2>個体数と種数</h2>
        <canvas class="chart" id="c-pop"></canvas>
        <div class="legend"><span><i style="background:var(--accent)"></i>個体</span><span><i style="background:var(--water)"></i>種</span><span><i style="background:var(--leaf)"></i>実効種</span></div>
        <div class="note" id="topline"></div>
      </div>
      <div>
        <h2>繁殖</h2>
        <dl id="repro" class="mini"></dl>
      </div>
      <div>
        <h2>体のつくり（平均）</h2>
        <canvas class="chart" id="c-body"></canvas>
        <div class="legend"><span><i style="background:var(--accent)"></i>パーツ数</span><span><i style="background:var(--leaf)"></i>体積 ×10</span></div>
      </div>
      <div>
        <h2>気候</h2>
        <canvas class="chart" id="c-clim"></canvas>
        <div class="legend"><span><i style="background:var(--danger)"></i>気温 ℃</span><span><i style="background:var(--water)"></i>湖面 m</span></div>
      </div>
      <div>
        <h2>植生</h2>
        <div class="plantbar" id="plantbar"></div>
        <div class="plantlegend" id="plantlegend"></div>
      </div>
    </section>

    <section class="pane" id="p-ind" role="tabpanel" hidden>
      <div id="ind-empty" class="empty">3D 画面の生物をクリックすると表示されます。<br><button class="lone" id="btn-random">ランダムに1体選ぶ</button></div>
      <div id="ind" hidden>
        <div class="tag">
          <div class="sp"><i id="i-dot"></i><span id="i-species"></span></div>
          <div class="sub" id="i-sub"></div>
        </div>
        <div style="margin-top:12px">
          <h2>エネルギー</h2>
          <div class="bar"><div id="i-ebar"></div></div>
          <div class="sub note" id="i-etext" style="font-family:var(--font-data)"></div>
        </div>
        <div style="margin-top:12px">
          <h2>消費の内訳（毎秒）</h2>
          <div class="costs">
            <div>基礎<b id="c-base">0</b></div><div>運動<b id="c-move">0</b></div><div>寒暖<b id="c-clim2">0</b></div><div>水中<b id="c-wet">0</b></div><div>密集・疫病<b id="c-crowd">0</b></div>
          </div>
        </div>
        <div style="margin-top:12px">
          <h2>体の形（真上から）</h2>
          <canvas id="body2d"></canvas>
        </div>
        <div style="margin-top:12px">
          <h2>記録</h2>
          <dl id="i-dl"></dl>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="lone" id="btn-follow" aria-pressed="false">追跡する</button>
          <button class="lone" id="btn-clear">選択を解除</button>
        </div>
      </div>
    </section>

    <section class="pane" id="p-tree" role="tabpanel" hidden>
      <div class="note" title="横軸は時間。線は種の存続期間、太線は現存種、縦の細線は祖先種からの分岐。種は「互いを配偶相手と認め、育つ子を残せるか」で判定し、集団が別々に変異を溜めて相手と認めなくなったり雑種が育たなくなったりすると、別の種として分かれます。">横軸は時間、太線は現存種</div>
      <div class="treewrap"><canvas id="tree"></canvas></div>
    </section>

    <section class="pane" id="p-log" role="tabpanel" hidden>
      <ul class="log" id="log"></ul>
    </section>
  </aside>
</div>
</body>
</html>
